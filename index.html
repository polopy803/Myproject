<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなページ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 { color: #2563eb; }
    button {
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #message { margin-top: 16px; font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>こんにちは！</h1>
  <p>シンプルなHTMLページです。</p>
  <button onclick="greet()">クリックしてね</button>
  <div id="message"></div>

  <script>
    function greet() {
      document.getElementById('message').textContent = 'ボタンがクリックされました！';
    }
  </script>
</body>
</html>
